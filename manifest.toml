packaging_format = 2

id = "filebrowser"
name = "Filebrowser"
description.en = "Web File Browser"
description.fr = "Gestionnaire de fichiers"

version = "2.63.21~ynh1"

maintainers = [ ]

[upstream]
license = "Apache-2.0"
website = "https://filebrowser.org"
admindoc = "https://filebrowser.org/"
code = "https://github.com/filebrowser/filebrowser"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/filebrowser"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"
    help.en = "Minimum length is 12"
    help.fr = "12 caractères minimum"

[resources]

    [resources.sources]

        [resources.sources.main]
        in_subdir = false
        amd64.url = "https://github.com/filebrowser/filebrowser/releases/download/v2.63.21/linux-amd64-filebrowser.tar.gz"
        amd64.sha256 = "8e3954467067aa6f4988dc6dd7357129fe38d2e445fa2936bebf99620bc07ec7"
        arm64.url = "https://github.com/filebrowser/filebrowser/releases/download/v2.63.21/linux-arm64-filebrowser.tar.gz"
        arm64.sha256 = "80d55942148701551b97533e0a11153f51191a668deea2735c496a5d1bab473a"
        i386.url = "https://github.com/filebrowser/filebrowser/releases/download/v2.63.21/linux-386-filebrowser.tar.gz"
        i386.sha256 = "aab6f39ec09c725047b9288079af27123a0cc6e13a2bf732a5cffd8caebe6272"
        armhf.url = "https://github.com/filebrowser/filebrowser/releases/download/v2.63.21/linux-armv7-filebrowser.tar.gz"
        armhf.sha256 = "cbd40a52023e7e911ce2403c614c7c9559f46057dc51d0fe29a99a6f29def1cc"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = "^linux-amd64-filebrowser.tar.gz$"
        autoupdate.asset.arm64 = "^linux-arm64-filebrowser.tar.gz$"
        autoupdate.asset.i386 = "^linux-386-filebrowser.tar.gz$"
        autoupdate.asset.armhf = "^linux-armv7-filebrowser.tar.gz$"

    [resources.ports]

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
